name: Import RONA ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Extract RONA source
        run: |
          set -eu
          ZIP="$(find . -maxdepth 1 -type f -iname 'RONA_Final_Candidate_PARTIAL.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p /tmp/rona-source
          unzip -q "$ZIP" -d /tmp/rona-source
          ROOT="$(find /tmp/rona-source -name package.json -type f -print -quit)"
          test -n "$ROOT"
          ROOT="$(dirname "$ROOT")"
          cp -a "$ROOT"/. .
          rm -f "$ZIP"
          rm -rf /tmp/rona-source

      - name: Upload extracted source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RONA-extracted-source
          path: .
          if-no-files-found: error
          retention-days: 3
